#
# 在[build]文件夹里面创建文件夹程序,请勿修改文件名称（institution.yml）
#
# 创建文件夹需要用到REPO_TOKEN密匙
#
# REPO_TOKEN密匙制作教程：https://git.io/jm.md
#

name: 创建文件夹
on:
  workflow_dispatch:
    inputs:
      establish_name:
        description: '输入您需要创建的文件夹名称（从 build/_template 模板创建，创建后请自行修改 settings.ini、diy-part.sh、seed/）'
        required: true
        default: ''
env:
  REPO_TOKEN: ${{ secrets.ACTIONS_TRIGGER_PAT }}
  GIT_REPOSITORY: ${{github.repository}}
  TONGBU_CANGKU: 1
  TZ: Asia/Shanghai

jobs:
  build:
    name: 在[build]文件夹里面创建文件夹
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id }} == ${{ github.event.sender.id }}
    
    steps:
    - name: 密匙检测（密匙为空则退出）
      run: |
        cd ${GITHUB_WORKSPACE}
        if [[ -n "${{ env.REPO_TOKEN }}" ]]; then
          curl -s -H "Authorization: Bearer ${{ env.REPO_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/releases/tag/API > mishi
          if [[ `grep -c "Bad credentials" mishi` -ge '1' ]]; then
            echo "您的密匙不正确或已过期，请按教程设置好密匙再来"
            echo "REPO_TOKEN密匙制作教程：https://git.io/jm.md"
            exit 1
          fi
        elif [[ -z "${{ env.REPO_TOKEN }}" ]]; then
          echo "您没有设置仓库密匙，请按教程设置好密匙再来"
          echo "REPO_TOKEN密匙制作教程：https://git.io/jm.md"
          exit 1
        fi
        
    - name: 准备结束
      uses: actions/checkout@v7

    - name: 获取编译框架(openwrt-common)
      uses: ./.github/actions/clone-common

    - name: 部署环境
      timeout-minutes: 60
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash ${LINSHI_COMMON}/custom/ubuntu.sh
        sudo timedatectl set-timezone "$TZ"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        
    - name: 创建文件夹
      if: env.REPO_TOKEN
      run: |
        cd $GITHUB_WORKSPACE
        git clone -b ${{ github.ref_name }} https://user:${REPO_TOKEN}@github.com/${{github.repository}} repogx
        if [[ -d "repogx/build/${{ inputs.establish_name }}" ]]; then
          echo "${{ inputs.establish_name }}已存在，无法继续创建"
          exit 1
        else
          # 从 _template 模板创建新源码文件夹，减少占位文件重复
          cp -Rf build/_template repogx/build/${{ inputs.establish_name }}
          # 单入口 compile.yml 编译：把新源码追加进 FOLDER_NAME 下拉选项（已存在则跳过）
          YML="repogx/.github/workflows/compile.yml"
          if ! grep -qE "^[[:space:]]*- '${{ inputs.establish_name }}'$" "${YML}"; then
            LAST_OPT="$(grep -n '^          - ' "${YML}" | tail -1 | cut -d: -f1)"
            sed -i "${LAST_OPT}a\\          - '${{ inputs.establish_name }}'" "${YML}"
            echo "已将 ${{ inputs.establish_name }} 追加到 compile.yml 的 FOLDER_NAME 下拉选项"
          else
            echo "${{ inputs.establish_name }} 已在下拉选项中，跳过追加"
          fi
        fi
        cd ${GITHUB_WORKSPACE}/repogx
        git add .
        git commit -m "Update $(date +%Y-%m%d-%H%M%S)"
        git push --quiet "https://${{ secrets.REPO_TOKEN }}@github.com/${{github.repository}}" HEAD:${{ github.ref_name }}
        if [[ $? -ne 0 ]]; then
          echo "${{ inputs.establish_name }}文件夹创建失败"
        else
          echo "${{ inputs.establish_name }}文件夹创建完成"
        fi
