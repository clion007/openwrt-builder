#
# 编译主程序,请勿修改文件名称（compile.yml）
# 单入口：workflow_dispatch 手动触发 / repository_dispatch 自动触发（LEDE 更新检查）
# 不再依赖 force push 间接触发
#

name: 编译固件

on:
  workflow_dispatch:
    inputs:
      FOLDER_NAME:
        description: '选择要编译的源码(对应build文件夹名)'
        required: true
        default: 'Lede'
        type: choice
        options:
          - 'Lede'
          - 'Immortalwrt'
          - 'Lienol'
          - 'Official'
          - 'Xwrt'
          - 'Mt798x'
      REPO_BRANCH:
        description: '源码分支(留空则使用该源码settings.ini默认值)'
        required: false
        default: ''
      CONFIG_FILE:
        description: '配置文件(留空则使用该源码settings.ini默认值,来自seed文件夹)'
        required: false
        default: ''
      INFORMATION_NOTICE:
        description: 'Telegram或pushplus信息通知(留空使用默认)'
        required: false
        default: ''
      RETAIN_MINUTE:
        description: '清理[X]分钟之前的所有操作记录(留空使用默认)'
        required: false
        default: ''
      KEEP_LATEST:
        description: '保留[X]个Releases不被清理(留空使用默认)'
        required: false
        default: ''
      SSH_ACTION:
        description: 'SSH远程配置固件'
        required: false
        default: 'false'
        type: boolean
      UPLOAD_FIRMWARE:
        description: '上传固件到 Github Artifacts'
        required: false
        default: 'true'
        type: boolean
      UPLOAD_RELEASE:
        description: '发布固件到 Github Releases'
        required: false
        default: 'true'
        type: boolean
      CACHEWRTBUILD_SWITCH:
        description: '缓存加速编译'
        required: false
        default: 'true'
        type: boolean
      UPDATE_FIRMWARE_ONLINE:
        description: '把自动在线更新固件功能编译进固件'
        required: false
        default: 'true'
        type: boolean
  repository_dispatch:
    types: [OpenWrt From Lean Firemware Update]

env:
  GIT_REPOSITORY: ${{github.repository}}
  REPO_TOKEN: ${{ secrets.ACTIONS_TRIGGER_PAT }}
  PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TZ: Asia/Shanghai

# 避免多源同时触发时抢占 runner 资源，同分支编译串行排队执行
concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 编译固件
    runs-on: ubuntu-24.04
    # repository_dispatch 已受仓库 PAT 保护(仅 owner 的 checker 机器人能触发),直接放行;
    # workflow_dispatch 手动触发仍校验 sender==owner,防止有写权限的协作方乱触发
    if: ${{ github.event_name == 'repository_dispatch' || github.event.repository.owner.id == github.event.sender.id }}

    permissions:
      actions: write
      contents: write
    
    steps:
    - name: 准备结束
      uses: actions/checkout@v7

    - name: 设置源码文件夹
      run: |
        if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
          FOLDER_NAME="${{ github.event.client_payload.FOLDER_NAME }}"
        else
          FOLDER_NAME="${{ github.event.inputs.FOLDER_NAME }}"
        fi
        echo "FOLDER_NAME=${FOLDER_NAME:-Lede}" >> ${GITHUB_ENV}

    - name: 密匙检测（密匙为空则退出）
      uses: ./.github/actions/yaoshi

    - name: 释放Ubuntu磁盘空间
      uses: ./.github/actions/free-space
      
    - name: 环境变量处理
      uses: ./.github/actions/var
        
    - name: 部署编译环境
      timeout-minutes: 60
      uses: ./.github/actions/env-setup

    - name: 下载源码
      working-directory: /${{ env.DIY_WORK }}
      run: |
        git clone -b "${REPO_BRANCH}" --single-branch --depth 1 "${REPO_URL}" openwrt
        ln -sf /${{ env.DIY_WORK }}/openwrt ${GITHUB_WORKSPACE}/openwrt
        echo "SHANG_CHUAN=true" >> ${GITHUB_ENV}
    
    - name: 公 告
      continue-on-error: true
      uses: ./.github/actions/message
 
    - name: 运行自定义文件和其他
      uses: ./.github/actions/need
        
    - name: 编译信息
      continue-on-error: true
      if: env.COMPILATION_INFORMATION == 'true'
      uses: ./.github/actions/message
        
    - name: 缓存加速
      if: env.CACHEWRTBUILD_SWITCH == 'true'
      uses: stupidloud/cachewrtbuild@b729f807837dbc3455d02fd35192660d9b662121
      with:
        ccache: 'true'
        mixkey: "${{ env.TARGET_PROFILE }}"
        prefix: ${{ github.workspace }}/openwrt
        
    - name: 下载软件包
      id: package
      timeout-minutes: 60
      run: |
        cd openwrt
        # make defconfig
        make download -j8
    
    - name: 开始编译固件
      id: compile
      timeout-minutes: 180
      if: steps.package.outcome == 'success'
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) V=s || make -j1 V=s
        echo "date=$(date "+%Y%m%d%H%M%S")" >> ${GITHUB_ENV}
        echo "Tongzhi_Date=$(date +%Y年%m月%d日)" >> ${GITHUB_ENV}
      
    # - name: 自动打包aarch64系列固件
    #   if: steps.compile.outcome == 'success' && env.ONLINE_FIRMWARE == 'true'
    #   uses: ./.github/actions/aarch

    - name: 整理固件文件夹(需配合diy-part.sh设定使用)
      continue-on-error: true
      if: steps.compile.outcome == 'success'
      run: |
        cd openwrt
        source $COMMON_SH && Diy_firmware

    - name: 发送[在线更新固件]至云端
      if: steps.compile.outcome == 'success' && env.UPDATE_FIRMWARE_ONLINE == 'true'
      uses: ./.github/actions/cloud
        
    - name: 上传,发布,信息通知
      if: steps.compile.outcome == 'success'
      uses: ./.github/actions/uploads

    - name: 清理Actions空间
      continue-on-error: true
      if: env.REPO_TOKEN
      uses: Mattraks/delete-workflow-runs@v2.1.0
      with:
        token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
        repository: ${{ github.repository }}
        # RETAIN_DAYS 由 var action 从 RETAIN_MINUTE 换算（保留最近 N 天内的记录），keep_minimum_runs 保底保留最近几次
        retain_days: ${{ env.RETAIN_DAYS }}
        keep_minimum_runs: 3

    - name: 清理releases
      continue-on-error: true
      if: env.REPO_TOKEN
      uses: ophub/delete-releases-workflows@v0.1.0
      with:
        delete_releases: true
        releases_keep_keyword: targz/Update
        releases_keep_latest: ${{ env.KEEP_LATEST }}
        delete_tags: true
        delete_workflows: false
        workflows_keep_day: 90
        gh_token: ${{ env.REPO_TOKEN }}
