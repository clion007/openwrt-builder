name: 'Deploy Build Environment'
description: 'Deploy OpenWrt build environment (ubuntu.sh + timezone + workdir)'
runs:
  using: "composite"
  steps:
    - name: 部署编译环境
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash ${LINSHI_COMMON}/custom/ubuntu.sh
        sudo timedatectl set-timezone "${TZ:-Asia/Shanghai}"
        sudo mkdir -p /${DIY_WORK:-workdir}
        sudo chown ${USER}:${GROUPS} /${DIY_WORK:-workdir}
branding:
  icon: "terminal"
  color: "gray-dark"
